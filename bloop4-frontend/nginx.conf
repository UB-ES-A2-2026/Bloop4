server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # HI ha un DNS intern de docker, d'aquesta manera Nginx resol "api" a cada petició
  # Això permet que si el contenidor de la API es recrea i canviés d'IP, no haguem de 
  # reinciar Nginx
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # En les peticions a la API van al contenidor api de docker 
  # Peticiones a la API → contenedor "api" de docker-compose (se pasa la URI tal cual).
  location /api/ {
    # Una foto pot fer fins a 10 MB (US-10); la resta de peticions són molt més petites.
    client_max_body_size 11m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fotos pujades pels venedors (volum compartit amb l'API, només lectura).
  location /uploads/ {
    alias /usr/share/nginx/uploads/;
    autoindex off;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Els assets de Vite porten un hash al nom
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
