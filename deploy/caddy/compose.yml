# Caddy: l'únic servei de la VM obert a Internet (ports 80 i 443).
# Posa l'HTTPS i envia cada adreça al frontend de producció o de staging.
# A la VM viu a /opt/bloop4/caddy (vegeu la secció «Desplegament» del README).
name: bloop4-caddy

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      PROD_ADDRESS: ${PROD_ADDRESS:?Falta PROD_ADDRESS al .env}
      STAGING_ADDRESS: ${STAGING_ADDRESS:?Falta STAGING_ADDRESS al .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data # Certificats HTTPS: si es perden, Caddy els torna a demanar
      - caddy_config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
    name: bloop4-edge
