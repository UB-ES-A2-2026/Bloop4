name: Historia de usuario
description: Una necesidad del usuario para el backlog del producto
title: "US-XX: "
labels: ["Historia d'Usuari"]
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como <rol>, quiero <acción>, para <beneficio>.
      placeholder: Como cliente, quiero ver el catálogo de productos, para saber qué material puedo alquilar.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Condiciones verificables, mejor en formato Dado / Cuando / Entonces.
      placeholder: |
        - [ ] Dado que abro la web, cuando carga, entonces veo todos los productos con nombre, precio por día y vendedor.
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options: ["Must", "Should", "Could", "Won't (este sprint)"]
    validations:
      required: true
  - type: input
    id: estimacion
    attributes:
      label: Estimación (story points)
      placeholder: "1, 2, 3, 5, 8, 13"
