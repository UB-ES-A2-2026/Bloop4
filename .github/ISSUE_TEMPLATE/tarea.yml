name: Tasca tècnica
description: Feina concreta que implementa (part d') una història d'usuari
labels: ["Tasca"]
body:
  - type: input
    id: historia
    attributes:
      label: Història relacionada
      description: Els commits d'aquesta tasca van a la branca d'aquesta història.
      placeholder: "#70 (US-12)"
  - type: dropdown
    id: area
    attributes:
      label: Àrea
      options: ["frontend", "api", "db", "docker / ci", "testing", "docs", "processos"]
    validations:
      required: true
  - type: textarea
    id: descripcio
    attributes:
      label: Què cal fer
    validations:
      required: true
  - type: textarea
    id: fet
    attributes:
      label: Definició de fet
      value: |
        - [ ] Commits a la branca de la història, fusionada a `dev` mitjançant PR
        - [ ] Els tests passen a la CI
        - [ ] Documentació actualitzada si cal
