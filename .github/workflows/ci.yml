name: CI

# Gitflow: les features entren a dev per PR i dev entra a main al final de l'sprint.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Un push nou a la mateixa branca cancel·la l'execució anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API + BD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: eventrent
          POSTGRES_PASSWORD: eventrent
          POSTGRES_DB: eventrent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventrent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://eventrent:eventrent@localhost:5432/eventrent
      API_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instal·lar dependències
        working-directory: api
        run: npm ci

      # Mateix criteri que db/migrate.sh: cada fitxer en una sola transacció.
      - name: Migracions i seeds
        run: |
          for file in db/migrations/*.sql db/seeds/*.sql; do
            echo "→ $file"
            psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 --single-transaction -f "$file"
          done
      # Els tests d'integració necessiten la BD amb les dades carregades.
      # Un fitxer per migració, cadascun en la seva sessió (vegeu db/tests/integrity/_helpers.sql).
      - name: Proves d'integritat de la BD
        working-directory: db/tests/integrity
        run: |
          for file in [0-9]*.sql; do
            echo "→ $file"
            cat _helpers.sql "$file" | psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1
          done

      # Falla si algun test falla o si la cobertura baixa dels llindars de tests/quality-gates.mjs.
      # El resum surt a la pestanya Summary de l'execució.
      - name: Tests de l'API (rutes + integració amb SQL real) i cobertura
        run: node tests/scripts/coverage.mjs api
      - name: Consultes d'exemple
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/queries/examples.sql

      # Arrenca l'API real contra la BD i comprova el contracte amb les dades d'exemple.
      - name: Smoke test de l'API
        run: |
          (cd api && npm start > ../api.log 2>&1 &)
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 "$API_URL/health"; echo
          # Un script per al Sprint 1 i un per història (tests/smoke/), independents entre ells: cadascun
          # inicia les seves sessions i fa servir les dades dels seeds.
          bash tests/smoke/run.sh

      - name: Log de l'API
        if: failure()
        run: cat api.log || true

      - name: Informe de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: |
            tests/reports/coverage-api.json
            api/coverage/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Provisional: mentre bloop4-frontend/ no sigui a main (#15), el job passa sense fer res.
      # Un cop fusionat, es pot esborrar aquest pas i totes les condicions `if`.
      - name: Comprovar si hi ha frontend
        id: frontend
        run: |
          if [ -f bloop4-frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::bloop4-frontend/ encara no existeix; s'ometen els tests del frontend."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bloop4-frontend/package-lock.json

      - name: Instal·lar dependències
        if: steps.frontend.outputs.present == 'true'
        working-directory: bloop4-frontend
        run: npm ci

      # Falla si algun test falla o si la cobertura baixa dels llindars de tests/quality-gates.mjs.
      - name: Tests i cobertura
        if: steps.frontend.outputs.present == 'true'
        run: node tests/scripts/coverage.mjs frontend

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: bloop4-frontend
        run: npm run build

      - name: Informe de cobertura
        if: ${{ !cancelled() && steps.frontend.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: |
            tests/reports/coverage-frontend.json
            bloop4-frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instal·lar les eines de QA
        working-directory: tests
        run: npm ci

      # Els errors bloquegen; els avisos (complexitat, accessibilitat) s'anoten al PR i no bloquegen.
      - name: ESLint
        working-directory: tests
        run: npm run lint

      - name: Informe de lint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: tests/reports/eslint.json
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependències
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Per deixar al PR el resum de la revisió quan falla
    steps:
      - uses: actions/checkout@v4

      # Només als PR: falla si el PR afegeix una dependència amb una vulnerabilitat alta o crítica.
      - name: Revisió de les dependències noves
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Informatiu: les vulnerabilitats que ja hi ha a les dependències de producció surten al resum.
      - name: npm audit
        working-directory: tests
        run: npm run audit

      - name: Informe de dependències
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: tests/reports/audit.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instal·lar les eines de QA
        working-directory: tests
        run: npm ci

      # Els navegadors de Playwright es guarden a la memòria cau, un per cada versió de Playwright.
      - name: Versió de Playwright
        id: playwright
        working-directory: tests
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Instal·lar Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Dependències del sistema de Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium

      # Stack de Docker Compose propi de les proves (ports 8180, 8125...), amb els seeds nets.
      - name: Aixecar el stack de proves
        id: stack
        working-directory: tests
        run: npm run e2e:up

      - name: Proves E2E i d'accessibilitat (axe)
        working-directory: tests
        run: npm run e2e

      # Només l'accessibilitat per sota de 90 fa fallar; rendiment, bones pràctiques i SEO són avisos.
      - name: Lighthouse
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: tests
        run: npm run lighthouse

      - name: Logs del stack
        if: failure()
        working-directory: tests
        run: npm run e2e:logs

      - name: Informes E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            tests/playwright-report/
            tests/test-results/
            tests/reports/playwright.json
            tests/reports/a11y/
            tests/reports/lighthouse/
            tests/reports/lighthouse.json
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Informe de QA
    needs: [api, frontend, lint, dependencies, e2e]
    # També quan algun job ha fallat: és quan l'informe és més útil.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Per publicar l'informe com a comentari del PR
    env:
      QA_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descarregar els informes dels altres jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Es compara amb l'últim resum de dev publicat al tauler de QA (si encara no n'hi ha, no es compara).
      - name: Generar l'informe
        run: node tests/scripts/qa-report.mjs --artifacts artifacts --baseline "${QA_DASHBOARD_URL}data/latest.json"

      # Un sol comentari per PR, que s'actualitza a cada push.
      - name: Comentari al PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('tests/reports/qa-report.md', 'utf8');
            const marker = '<!-- bloop4-qa-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Resum de QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary
          path: |
            tests/reports/qa-summary.json
            tests/reports/qa-report.md
          retention-days: 90
